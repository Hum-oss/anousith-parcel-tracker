<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anousith Express — ระบบติดตามพัสดุ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Noto Sans Thai', sans-serif; background:#F7F5F3; color:#221F1F; }
  a { color: #B3160F; text-decoration: none; }
  a:hover { color: #85100B; text-decoration: underline; }
  ::placeholder { color: #A39C99; }
  button, input, select, textarea { font-family: 'Noto Sans Thai', sans-serif; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .fadein { animation: fadeIn .3s ease; }
  .clickable { cursor: pointer; }
  table { border-collapse: collapse; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
 * Anousith Express — ระบบติดตามพัสดุ (เชื่อมต่อ Flask backend จริง)
 * Flask เสิร์ฟหน้านี้เอง (same-origin) จึงเรียก API ผ่าน fetch() ธรรมดา
 * และใช้ cookie session ของ Flask แทน sessionToken/JSONP แบบเดิม
 * ===================================================================== */

// ตรงกับ STATUSES ใน app.py / Code_2.gs เป๊ะๆ — ห้ามแก้ชื่อสถานะ เพราะ backend ตรวจสอบตรงตัว
const STATUS_FLOW = ['รอติดตาม', 'กำลังติดตาม', 'ส่งสาขา', 'ส่งสาขา/ปิดเรื่อง'];
const STATUS_COLORS = {
  'รอติดตาม': { bg: '#EFEDEC', color: '#5A5450' },
  'กำลังติดตาม': { bg: '#FCEFDB', color: '#B5730A' },
  'ส่งสาขา': { bg: '#DDEAFB', color: '#1E5FA8' },
  'ส่งสาขา/ปิดเรื่อง': { bg: '#DFF1E1', color: '#2E7D32' },
};
const DONUT_COLORS = { 'รอติดตาม': '#A39C99', 'กำลังติดตาม': '#EE9E3A', 'ส่งสาขา': '#3B82D6', 'ส่งสาขา/ปิดเรื่อง': '#2E7D32' };

// ตรงกับ CONFIG.CHANNELS ใน Code_2.gs — แก้เฉพาะจุดที่โค้ดเดิมมี stray comma (ช่องว่าง undefined)
// และสะกด "whatapp" ใหม่เป็น "WhatsApp" เฉพาะฝั่งหน้าเว็บนี้ (ไม่แตะ Apps Script เดิม)
const CHANNEL_OPTIONS = ['LINE', 'Facebook Messenger', 'WhatsApp', 'โทรศัพท์', 'อื่นๆ'];
const CHANNEL_COLORS = { 'LINE': '#2E7D32', 'Facebook Messenger': '#1E5FA8', 'WhatsApp': '#2E7D32', 'โทรศัพท์': '#B5730A', 'อื่นๆ': '#5A5450' };

// ตรงกับ CONFIG.COMPANIES ใน Code_2.gs
const COMPANY_OPTIONS = ['Lazada', 'Flash', 'Kerry', 'J&T', 'Shopee', 'Thaipost', 'อื่นๆ'];
const COMPANY_COLORS = { 'Lazada': '#D6201F', 'Flash': '#B5730A', 'J&T': '#1E5FA8', 'Shopee': '#EE5A2C', 'Kerry': '#2E7D32', 'Thaipost': '#5A5450' };

const THAI_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

// ===================== fetch() helpers (same-origin, ใช้ cookie session ของ Flask) =====================
function qs(params) {
  const p = new URLSearchParams();
  Object.keys(params || {}).forEach((k) => {
    const v = params[k];
    if (v !== undefined && v !== null && v !== '') p.set(k, v);
  });
  const s = p.toString();
  return s ? '?' + s : '';
}

async function apiRequest(method, path, body) {
  const opts = { method, credentials: 'same-origin', headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  let res;
  try {
    res = await fetch(path, opts);
  } catch (e) {
    throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต');
  }
  let data;
  try {
    data = await res.json();
  } catch (e) {
    throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (' + res.status + ')');
  }
  data.__status = res.status;
  return data;
}
function apiGet(path, params) { return apiRequest('GET', path + qs(params)); }
function apiPost(path, body) { return apiRequest('POST', path, body || {}); }
function apiPatch(path, body) { return apiRequest('PATCH', path, body || {}); }
function apiDelete(path) { return apiRequest('DELETE', path); }

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// "พนักงานดูแล" — ถ้ายังไม่มีเจ้าหน้าที่คนไหนอัปเดตเคสนี้เลย (lastStaff ว่าง) ให้ใช้ "แหล่งที่มา" แทน
// (เคส sync จาก AppSheet ส่วนใหญ่มีชื่อผู้บันทึกอยู่ในแหล่งที่มาอยู่แล้ว) ใช้จุดเดียวนี้ทุกที่ที่แสดงพนักงานดูแล
function caseOwner(c) {
  return (c.lastStaff && c.lastStaff.trim()) || (c.source && c.source.trim()) || '';
}

// ===================== รูปภาพจาก Google Drive =====================
// รูปที่ sync มาจาก AppSheet เก็บเป็นลิงก์ https://drive.google.com/uc?export=view&id=... ซึ่ง
// ใช้เป็น <img src> ตรงๆ ได้ไม่เสถียร (กูเกิลจำกัด hotlink บนลิงก์รูปแบบนี้บ่อยๆ แม้ไฟล์จะแชร์แบบ
// "ทุกคนที่มีลิงก์ดูได้" อยู่แล้วก็ตาม) — ฟังก์ชันนี้ดึง fileId ออกมาแล้วสร้างลิงก์รูปแบบที่โหลดได้เสถียรกว่า
function extractDriveFileId(url) {
  if (!url) return null;
  let m = String(url).match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  m = String(url).match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  return null;
}
function driveThumbUrl(url) {
  const id = extractDriveFileId(url);
  return id ? ('https://drive.google.com/thumbnail?id=' + id + '&sz=w1000') : url;
}
function driveViewUrl(url) {
  const id = extractDriveFileId(url);
  return id ? ('https://drive.google.com/file/d/' + id + '/view') : url;
}
// onerror ของ <img>: ถ้าลิงก์แบบ thumbnail โหลดไม่ขึ้น ให้ลองรูปแบบสำรอง (lh3.googleusercontent.com) ก่อนค่อยซ่อนรูปทิ้ง
function handlePhotoError(img) {
  const stage = img.dataset.stage || '0';
  const id = extractDriveFileId(img.dataset.orig);
  if (stage === '0' && id) {
    img.dataset.stage = '1';
    img.src = 'https://lh3.googleusercontent.com/d/' + id + '=w1000';
    return;
  }
  img.style.display = 'none';
}

// yyyy-MM-dd HH:mm:ss (หรือ yyyy-MM-dd) -> "18 ส.ค. 2569" (พ.ศ.)
function fmtDateThai(str) {
  if (!str) return '';
  const m = String(str).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return String(str);
  const y = parseInt(m[1], 10) + 543;
  const mo = parseInt(m[2], 10) - 1;
  const d = parseInt(m[3], 10);
  return d + ' ' + (THAI_MONTHS[mo] || '') + ' ' + y;
}
function fmtDateTimeThai(str) {
  if (!str) return '';
  const m = String(str).match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/);
  if (!m) return fmtDateThai(str);
  return fmtDateThai(str) + ' ' + m[4] + ' น.';
}
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function daysAgoISO(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// ===================== App state =====================
const state = {
  view: 'search', // search | report | staffLogin | staff
  loading: false,
  toast: null,
  booting: true, // true จนกว่าจะเช็ค /api/me เสร็จรอบแรก

  // auth
  auth: null, // { username, nickname, role } — sessionToken เดิมถูกแทนด้วย cookie session ของ Flask

  // public search
  searchResult: null, searchError: null, searched: false, searchLoading: false,
  // ฟอร์มยืนยันข้อมูลติดต่อ (ชื่อ+เบอร์) ตอนค้นหาเจอพัสดุจากหน้า public
  contactFormSubmitting: false, contactFormSubmitted: false, contactFormError: null,

  // public / staff report form
  reportOpen: false, // when true inside staff view, shows the report form as a modal
  reportSubmitting: false, reportSubmitted: false, reportError: null, newTicketId: '', reportMatched: false,

  // staff
  staffPage: 'dashboard', // dashboard | cases
  cases: [], casesLoaded: false, casesLoading: false, casesError: null,
  reportRange: 'week', reportFrom: '', reportTo: '',
  reportStatusFilter: [],
  dashboardFilter: null, // {type, value}
  // ตัวกรองวันที่ของหน้าเคสแจ้งเรื่อง — แยกอิสระจากตัวกรองของแดชบอร์ดโดยสิ้นเชิง
  casesRange: 'all', // all | day | week | month
  selectedTicket: null,
  pendingStatus: null,
  caseHistory: [],
  caseHistoryLoading: false,
  pendingPhotoFile: null,
  pendingPhotoPreviewUrl: null,
  photoUploading: false,
  exportBusy: false,

  users: [], usersLoaded: false, usersLoading: false,
  userFormOpen: false, userFormError: null, userFormBusy: false,
};

function setState(patch) { Object.assign(state, patch); render(); }
function showToast(msg) {
  state.toast = msg; render();
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { state.toast = null; render(); }, 2600);
}

// ===================== Actions =====================
function goSearch() { setState({ view: 'search', searchResult: null, searched: false, searchError: null, reportOpen: false, contactFormSubmitted: false, contactFormError: null }); }
function goReport() { setState({ view: 'report', reportSubmitted: false, reportError: null }); }
function goStaffLogin() { setState({ view: 'staffLogin' }); }

async function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!username || !password) { showToast('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'); return; }
  setState({ loading: true });
  try {
    const res = await apiPost('/api/login', { username, password });
    if (!res.ok) { setState({ loading: false }); showToast(res.error || 'เข้าสู่ระบบไม่สำเร็จ'); return; }
    setState({
      loading: false, view: 'staff', staffPage: 'dashboard',
      auth: { username: res.username, nickname: res.nickname, role: res.role },
      cases: [], casesLoaded: false, users: [], usersLoaded: false,
    });
    loadCases();
  } catch (e) {
    setState({ loading: false }); showToast(e.message || 'เข้าสู่ระบบไม่สำเร็จ');
  }
}

async function doLogout() {
  apiPost('/api/logout').catch(() => {});
  setState({ view: 'search', auth: null, cases: [], casesLoaded: false, users: [], usersLoaded: false, selectedTicket: null });
}

// ถ้า session หมดอายุระหว่างใช้งาน (คุกกี้หมดอายุ/ถูกล้าง) ให้เด้งกลับหน้า login พร้อม toast
function handleAuthExpired(res) {
  if (res && res.__status === 401) {
    setState({ view: 'staffLogin', auth: null });
    showToast(res.error || 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
    return true;
  }
  return false;
}

async function onSearch() {
  const q = document.getElementById('searchQuery').value.trim();
  if (!q) { setState({ searchError: 'กรุณากรอกเลขพัสดุหรือเลขแจ้งเรื่อง', searchResult: null, searched: false }); return; }
  setState({ searchLoading: true, searchError: null, contactFormSubmitted: false, contactFormError: null });
  try {
    const res = await apiGet('/api/search', { q });
    if (!res.ok) { setState({ searchLoading: false, searchResult: null, searched: true, searchError: null }); return; }
    setState({ searchLoading: false, searchResult: res.case, searched: true, searchError: null });
  } catch (e) {
    setState({ searchLoading: false, searchError: e.message || 'ค้นหาไม่สำเร็จ ลองใหม่อีกครั้ง' });
  }
}

// ยืนยันข้อมูลติดต่อ (ชื่อ+เบอร์) จากหน้าค้นหา — ใช้ endpoint เดียวกับแจ้งเรื่องพัสดุ (/api/complaints)
// เพราะเคสมีอยู่แล้ว ระบบจะจับคู่ด้วยเลขพัสดุแล้วเติม/บันทึกข้อมูลติดต่อให้อัตโนมัติ
async function onConfirmContact() {
  const name = document.getElementById('confirmName').value.trim();
  const phone = document.getElementById('confirmPhone').value.trim();
  if (!name || !phone) { setState({ contactFormError: 'กรุณากรอกชื่อและที่อยู่ผู้แจ้งและเบอร์โทรศัพท์' }); return; }
  const r = state.searchResult;
  if (!r) return;
  setState({ contactFormSubmitting: true, contactFormError: null });
  try {
    const res = await apiPost('/api/complaints', { parcelNo: r.parcelNo, company: r.company, name, phone, detail: '' });
    if (!res.ok) { setState({ contactFormSubmitting: false, contactFormError: res.error || 'บันทึกข้อมูลไม่สำเร็จ' }); return; }
    setState({ contactFormSubmitting: false, contactFormSubmitted: true, contactFormError: null });
  } catch (e) {
    setState({ contactFormSubmitting: false, contactFormError: e.message || 'บันทึกข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง' });
  }
}

async function onSubmitReport() {
  const parcelNo = document.getElementById('reportParcelCode').value.trim();
  const company = document.getElementById('reportCompany').value;
  const name = document.getElementById('reportName').value.trim();
  const phone = document.getElementById('reportPhone').value.trim();
  const detail = document.getElementById('reportDetail').value.trim();
  if (!parcelNo) { setState({ reportError: 'กรุณากรอกเลขพัสดุ' }); return; }
  if (!name || !phone) { setState({ reportError: 'กรุณากรอกชื่อและที่อยู่ผู้แจ้งและเบอร์โทรติดต่อกลับ' }); return; }
  setState({ reportSubmitting: true, reportError: null });
  try {
    const res = await apiPost('/api/complaints', { parcelNo, company, name, phone, detail });
    if (!res.ok) { setState({ reportSubmitting: false, reportError: res.error || 'ส่งเรื่องไม่สำเร็จ' }); return; }
    setState({
      reportSubmitting: false, reportSubmitted: true, newTicketId: res.ticketNo, reportMatched: !!res.matched,
      reportError: null, reportOpen: false,
    });
    if (state.auth) loadCases(); // ถ้าเจ้าหน้าที่เป็นคนเพิ่มเรื่องจากในระบบ ให้รีเฟรชรายการ
  } catch (e) {
    setState({ reportSubmitting: false, reportError: e.message || 'ส่งเรื่องไม่สำเร็จ ลองใหม่อีกครั้ง' });
  }
}

function openReportModal() { setState({ reportOpen: true, reportSubmitted: false, reportError: null }); }
function closeReportModal() { setState({ reportOpen: false }); }

function goStaffPage(page) { setState({ staffPage: page, dashboardFilter: null, selectedTicket: null, pendingStatus: null }); if (page === 'users' && !state.usersLoaded) loadUsers(); }

async function loadCases() {
  if (!state.auth) return;
  setState({ casesLoading: true, casesError: null });
  try {
    const res = await apiGet('/api/cases');
    if (handleAuthExpired(res)) return;
    if (!res.ok) { setState({ casesLoading: false, casesError: res.error || 'โหลดข้อมูลไม่สำเร็จ' }); return; }
    setState({ casesLoading: false, casesLoaded: true, cases: res.cases || [] });
  } catch (e) {
    setState({ casesLoading: false, casesError: e.message || 'โหลดข้อมูลไม่สำเร็จ' });
  }
}

async function loadUsers() {
  if (!state.auth || state.auth.role !== 'admin') return;
  setState({ usersLoading: true });
  try {
    const res = await apiGet('/api/users');
    if (handleAuthExpired(res)) return;
    if (!res.ok) { setState({ usersLoading: false }); showToast(res.error || 'โหลดผู้ใช้งานไม่สำเร็จ'); return; }
    setState({ usersLoading: false, usersLoaded: true, users: res.users || [] });
  } catch (e) {
    setState({ usersLoading: false }); showToast(e.message || 'โหลดผู้ใช้งานไม่สำเร็จ');
  }
}

function setReportRange(r) { setState({ reportRange: r }); }
function setCasesRange(r) { setState({ casesRange: r }); }
function onReportFromChange() { setState({ reportFrom: document.getElementById('reportFromInput').value }); }
function onReportToChange() { setState({ reportTo: document.getElementById('reportToInput').value }); }
function toggleReportStatus(status) {
  const cur = state.reportStatusFilter;
  const next = cur.includes(status) ? cur.filter((s) => s !== status) : [...cur, status];
  setState({ reportStatusFilter: next });
}
function selectAllReportStatus() { setState({ reportStatusFilter: STATUS_FLOW.slice() }); }
function toggleDashboardFilter(type, value) {
  const cur = state.dashboardFilter;
  const isSame = cur && cur.type === type && cur.value === value;
  setState({ dashboardFilter: isSame ? null : { type, value } });
}
function clearDashboardFilter() { setState({ dashboardFilter: null, reportStatusFilter: [] }); }

async function openCase(ticketNo) {
  if (state.pendingPhotoPreviewUrl) URL.revokeObjectURL(state.pendingPhotoPreviewUrl);
  setState({
    selectedTicket: ticketNo, pendingStatus: null, caseHistory: [], caseHistoryLoading: true,
    pendingPhotoFile: null, pendingPhotoPreviewUrl: null, photoUploading: false,
  });
  try {
    const res = await apiGet('/api/cases/' + encodeURIComponent(ticketNo));
    if (handleAuthExpired(res)) return;
    if (state.selectedTicket !== ticketNo) return; // ผู้ใช้กดเปลี่ยนเคส/กลับไปแล้วก่อนโหลดเสร็จ
    setState({ caseHistory: res.ok ? (res.history || []) : [], caseHistoryLoading: false });
  } catch (e) {
    setState({ caseHistoryLoading: false });
  }
}
function closeCase() {
  if (state.pendingPhotoPreviewUrl) URL.revokeObjectURL(state.pendingPhotoPreviewUrl);
  setState({
    selectedTicket: null, pendingStatus: null, caseHistory: [], caseHistoryLoading: false,
    pendingPhotoFile: null, pendingPhotoPreviewUrl: null, photoUploading: false,
  });
}
function stopProp(ev) { ev.stopPropagation(); }

// เลือกสถานะที่จะเปลี่ยน (ยังไม่บันทึก) — เลือกได้อิสระไม่ต้องเรียงลำดับ กดปุ่มยืนยันด้านล่างถึงจะบันทึกจริง
function selectPendingStatus(status) {
  if (!state.auth) return;
  setState({ pendingStatus: status });
}
function cancelPendingStatus() { setState({ pendingStatus: null }); }

async function confirmStatusChange(ticketNo) {
  if (!state.auth || !state.pendingStatus) return;
  const status = state.pendingStatus;
  setState({ loading: true });
  try {
    const res = await apiPatch('/api/cases/' + encodeURIComponent(ticketNo), { status });
    if (handleAuthExpired(res)) return;
    if (!res.ok) { setState({ loading: false }); showToast(res.error || 'อัปเดตสถานะไม่สำเร็จ'); return; }
    // อัปเดตเคสในหน่วยความจำโดยตรงจากข้อมูลที่ API ส่งกลับมา แทนการโหลดทั้งชีตใหม่ (loadCases) ทุกครั้ง — เร็วขึ้นมาก
    const cases = res.case ? state.cases.map((c) => (c.ticketNo === ticketNo ? res.case : c)) : state.cases;
    setState({ loading: false, cases, pendingStatus: null });
    showToast('อัปเดตสถานะแล้ว');
    // โหลดประวัติการติดตามใหม่ เพราะเพิ่งมีรายการล่าสุดถูกบันทึกเพิ่ม
    try {
      const histRes = await apiGet('/api/cases/' + encodeURIComponent(ticketNo));
      if (histRes.ok && state.selectedTicket === ticketNo) setState({ caseHistory: histRes.history || [] });
    } catch (e2) { /* ไม่ต้องแจ้งเตือน แค่ประวัติจะไม่รีเฟรชเฉยๆ */ }
  } catch (e) {
    setState({ loading: false }); showToast(e.message || 'อัปเดตสถานะไม่สำเร็จ');
  }
}

// ===================== เพิ่ม/แก้ไขรูปภาพประกอบเคส (พนักงานทุกคนมีสิทธิ์) =====================
// เลือกไฟล์แล้วยังไม่อัปโหลดทันที — ต้องกดยืนยัน (ดู state.pendingPhotoFile) ก่อนถึงจะอัปโหลดจริง
const ALLOWED_PHOTO_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
const MAX_PHOTO_BYTES = 8 * 1024 * 1024;

function onPhotoFileSelected(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  inputEl.value = ''; // เคลียร์ input ทันที เพื่อให้เลือกไฟล์เดิมซ้ำได้อีกครั้งถ้ายกเลิกแล้วเลือกใหม่
  if (!file) return;
  if (!ALLOWED_PHOTO_TYPES.includes(file.type)) { showToast('รองรับเฉพาะไฟล์รูปภาพ (JPG, PNG, WEBP, GIF)'); return; }
  if (file.size > MAX_PHOTO_BYTES) { showToast('ไฟล์รูปภาพใหญ่เกินไป (สูงสุดไม่เกิน 8MB)'); return; }
  if (state.pendingPhotoPreviewUrl) URL.revokeObjectURL(state.pendingPhotoPreviewUrl);
  setState({ pendingPhotoFile: file, pendingPhotoPreviewUrl: URL.createObjectURL(file) });
}

function cancelPendingPhoto() {
  if (state.pendingPhotoPreviewUrl) URL.revokeObjectURL(state.pendingPhotoPreviewUrl);
  setState({ pendingPhotoFile: null, pendingPhotoPreviewUrl: null });
}

async function confirmPhotoUpload(ticketNo) {
  if (!state.auth || !state.pendingPhotoFile) return;
  const file = state.pendingPhotoFile;
  setState({ photoUploading: true });
  try {
    const fd = new FormData();
    fd.append('photo', file);
    const res = await fetch('/api/cases/' + encodeURIComponent(ticketNo) + '/photo', {
      method: 'POST', credentials: 'same-origin', body: fd,
    });
    let data;
    try { data = await res.json(); } catch (e) { data = { ok: false, error: 'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง' }; }
    data.__status = res.status;
    if (handleAuthExpired(data)) return;
    if (!data.ok) { showToast(data.error || 'อัปโหลดรูปภาพไม่สำเร็จ'); return; }
    const cases = data.case ? state.cases.map((c) => (c.ticketNo === ticketNo ? data.case : c)) : state.cases;
    if (state.pendingPhotoPreviewUrl) URL.revokeObjectURL(state.pendingPhotoPreviewUrl);
    setState({ cases, pendingPhotoFile: null, pendingPhotoPreviewUrl: null });
    showToast('บันทึกรูปภาพแล้ว');
    // โหลดประวัติการติดตามใหม่ เพราะเพิ่งมีรายการล่าสุดถูกบันทึกเพิ่ม (เพิ่ม/แก้ไขรูปภาพ)
    try {
      const histRes = await apiGet('/api/cases/' + encodeURIComponent(ticketNo));
      if (histRes.ok && state.selectedTicket === ticketNo) setState({ caseHistory: histRes.history || [] });
    } catch (e2) { /* ไม่ต้องแจ้งเตือน แค่ประวัติจะไม่รีเฟรชเฉยๆ */ }
  } catch (e) {
    showToast(e.message || 'อัปโหลดรูปภาพไม่สำเร็จ');
  } finally {
    setState({ photoUploading: false });
  }
}

// ส่งออก Excel: /api/export.xlsx เป็น POST ผ่านฟอร์มจริง (ดูฟังก์ชันด้านล่าง) เพื่อให้ดาวน์โหลดได้ชัวร์
// และไม่ติดข้อจำกัดความยาว URL เมื่อมีรายการเคสเยอะ
function onExportExcel(source) {
  if (!state.auth) return;
  const d = computeDerived();
  const list = source === 'dashboard' ? d.filteredCases : d.casesSorted;
  const tickets = list.map((c) => c.ticketNo);
  if (!tickets.length) { showToast('ไม่มีรายการเคสให้ออกรายงาน'); return; }
  // ตัวกรองวันที่ของแต่ละหน้าคำนวณแยกกัน (แดชบอร์ดใช้ currentRangeDates, เคสแจ้งเรื่องใช้ casesRangeDates ของตัวเอง)
  // ใช้แค่ประกอบชื่อไฟล์/สรุปในรายงาน ไม่ได้ใช้กรองข้อมูลซ้ำฝั่ง backend (ฝั่งหน้าเว็บกรองมาให้แล้วผ่านรายการ tickets)
  const { dateFrom, dateTo } = source === 'dashboard' ? currentRangeDates() : casesRangeDates();
  // ส่งเป็นฟอร์ม POST จริง (ไม่ใช่ fetch+Blob และไม่ใช่ query string) เพื่อเลี่ยงข้อจำกัดความยาว URL
  // เมื่อมีเคสจำนวนมาก (เคยเจอปัญหา "Request Line too large" ตอนใช้ GET + query string) และยังให้
  // เบราว์เซอร์ดาวน์โหลดไฟล์ให้เองแบบเดียวกับเปิดลิงก์ตรงๆ ซึ่งเสถียรกว่าการดาวน์โหลดผ่าน JS Blob
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = '/api/export.xlsx';
  form.target = '_blank';
  form.style.display = 'none';
  const addField = (name, value) => {
    const input = document.createElement('input');
    input.type = 'hidden'; input.name = name; input.value = value;
    form.appendChild(input);
  };
  addField('tickets', tickets.join(','));
  addField('dateFrom', dateFrom || '');
  addField('dateTo', dateTo || '');
  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);
}

function saveDashboardImage() {
  const el = document.getElementById('dashboardCapture');

// ===================== คำนวณช่วงวันที่จาก reportRange =====================
function currentRangeDates() {
  if (state.reportRange === 'custom') return { dateFrom: state.reportFrom, dateTo: state.reportTo };
  if (state.reportRange === 'day') return { dateFrom: todayISO(), dateTo: todayISO() };
  if (state.reportRange === 'week') return { dateFrom: daysAgoISO(6), dateTo: todayISO() };
  if (state.reportRange === 'month') return { dateFrom: daysAgoISO(29), dateTo: todayISO() };
  return { dateFrom: '', dateTo: '' };
}

// ตัวกรองวันที่ของหน้าเคสแจ้งเรื่อง — คำนวณแยกจาก currentRangeDates() (ของแดชบอร์ด) โดยสิ้นเชิง
function casesRangeDates() {
  if (state.casesRange === 'day') return { dateFrom: todayISO(), dateTo: todayISO() };
  if (state.casesRange === 'week') return { dateFrom: daysAgoISO(6), dateTo: todayISO() };
  if (state.casesRange === 'month') return { dateFrom: daysAgoISO(29), dateTo: todayISO() };
  return { dateFrom: '', dateTo: '' }; // 'all' — ไม่กรองวันที่
}

// ===================== Derived data (เหมือน renderVals เดิม แต่ใช้ข้อมูลจริงจาก /api/cases) =====================
function computeDerived() {
  const { dateFrom, dateTo } = currentRangeDates();
  const from = dateFrom ? new Date(dateFrom + ' 00:00:00') : null;
  const to = dateTo ? new Date(dateTo + ' 23:59:59') : null;

  let inRange = state.cases.filter((c) => {
    if (!from && !to) return true;
    const opened = new Date(c.openedAt);
    if (from && opened < from) return false;
    if (to && opened > to) return false;
    return true;
  });

  const dashFilter = state.dashboardFilter;
  const statusChipsActive = state.reportStatusFilter.length > 0;
  const matchesFilter = (c) => {
    if (dashFilter) {
      if (dashFilter.type === 'status' && c.status !== dashFilter.value) return false;
      if (dashFilter.type === 'channel' && c.lastChannel !== dashFilter.value) return false;
      if (dashFilter.type === 'company' && c.company !== dashFilter.value) return false;
    }
    if (statusChipsActive && !state.reportStatusFilter.includes(c.status)) return false;
    return true;
  };
  const filtered = inRange.filter(matchesFilter);

  const totalCases = filtered.length;
  const closedCases = filtered.filter((c) => c.status === 'ส่งสาขา/ปิดเรื่อง').length;
  const openCases = totalCases - closedCases;
  const closedWithDates = filtered.filter((c) => c.status === 'ส่งสาขา/ปิดเรื่อง' && c.closedAt && c.openedAt);
  const avgCloseDays = closedWithDates.length
    ? (closedWithDates.reduce((sum, c) => sum + (new Date(c.closedAt) - new Date(c.openedAt)) / 86400000, 0) / closedWithDates.length).toFixed(1)
    : null;

  let cursor = 0;
  const totalAll = filtered.length || 1;
  const statusBars = STATUS_FLOW.map((label) => {
    const count = filtered.filter((c) => c.status === label).length;
    const pct = (count / totalAll) * 100;
    const start = cursor; cursor += pct;
    const active = dashFilter && dashFilter.type === 'status' && dashFilter.value === label;
    return { label, count, start, end: cursor, color: DONUT_COLORS[label], dim: (dashFilter && !active) ? '0.4' : '1' };
  });
  const donutGradient = statusBars.map((b) => `${b.color} ${b.start}% ${b.end}%`).join(', ');

  const channelCounts = {};
  filtered.forEach((c) => { if (c.lastChannel) channelCounts[c.lastChannel] = (channelCounts[c.lastChannel] || 0) + 1; });
  const maxChannel = Math.max(1, ...Object.values(channelCounts), 0);
  const channelBars = Object.keys(channelCounts).map((label) => {
    const count = channelCounts[label];
    const active = dashFilter && dashFilter.type === 'channel' && dashFilter.value === label;
    return { label, count, pct: Math.round((count / maxChannel) * 100) + '%', color: CHANNEL_COLORS[label] || '#8A8380', dim: (dashFilter && !active) ? '0.4' : '1' };
  });

  const companyCounts = {};
  filtered.forEach((c) => { if (c.company) companyCounts[c.company] = (companyCounts[c.company] || 0) + 1; });
  const maxCompany = Math.max(1, ...Object.values(companyCounts), 0);
  const companyBars = Object.keys(companyCounts).map((label) => {
    const count = companyCounts[label];
    const active = dashFilter && dashFilter.type === 'company' && dashFilter.value === label;
    return { label, count, pct: Math.round((count / maxCompany) * 100) + '%', color: COMPANY_COLORS[label] || '#8A8380', dim: (dashFilter && !active) ? '0.4' : '1' };
  });

  const staffNames = Array.from(new Set(filtered.map((c) => caseOwner(c)).filter(Boolean)));
  const staffStats = staffNames.map((name) => {
    const mine = filtered.filter((c) => caseOwner(c) === name);
    const closed = mine.filter((c) => c.status === 'ส่งสาขา/ปิดเรื่อง');
    const closedD = closed.filter((c) => c.closedAt && c.openedAt);
    const avg = closedD.length
      ? (closedD.reduce((s, c) => s + (new Date(c.closedAt) - new Date(c.openedAt)) / 86400000, 0) / closedD.length).toFixed(1) + ' วัน'
      : '-';
    return { name, total: mine.length, closed: closed.length, avgTime: avg };
  });

  // หน้าเคสแจ้งเรื่อง: ตัวกรองแยกออกจากหน้าแดชบอร์ดโดยสิ้นเชิง มีตัวกรองวันที่ของตัวเอง (วันนี้/สัปดาห์/เดือน/ทั้งหมด)
  // ไม่ผูกกับช่วงวันที่/สถานะ/ตัวกรองของแดชบอร์ดเลย และไม่แสดงเคสที่ปิดแล้ว เรียงตามวันที่แจ้งเรื่องก่อน-หลัง
  const casesRangeD = casesRangeDates();
  const casesFrom = casesRangeD.dateFrom ? new Date(casesRangeD.dateFrom + ' 00:00:00') : null;
  const casesTo = casesRangeD.dateTo ? new Date(casesRangeD.dateTo + ' 23:59:59') : null;
  const casesSorted = state.cases.filter((c) => {
    if (c.status === 'ส่งสาขา/ปิดเรื่อง') return false;
    if (!casesFrom && !casesTo) return true;
    const opened = new Date(c.openedAt);
    if (casesFrom && opened < casesFrom) return false;
    if (casesTo && opened > casesTo) return false;
    return true;
  }).sort((a, b) => new Date(a.openedAt) - new Date(b.openedAt));

  return {
    totalCases, closedCases, openCases, avgCloseDays,
    statusBars, donutGradient, channelBars, companyBars, staffStats, casesSorted,
    // ชุดเคสที่ตรงกับตัวกรองบนแดชบอร์ดทั้งหมด (รวมที่ปิดแล้ว) — ใช้สำหรับออกรายงาน Excel จากหน้าแดชบอร์ด
    filteredCases: filtered,
    dashFilterActive: !!dashFilter || statusChipsActive,
    dashFilterLabel: dashFilter ? dashFilter.value : state.reportStatusFilter.join(', '),
  };
}

              ${hasPhoto ? `

            <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:8px">

          `}
        </div>
      </div>`;
    }
    body += `</section>`;
  }

  if (s.view === 'report') {
    body += renderReportForm(false);
  }

  return `<div>${publicHeader()}${body}${publicFooter()}</div>`;
}

            <option value="">เลือกบริษัทขนส่ง</option>
            ${COMPANY_OPTIONS.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}

      ${s.reportError ? `<div style="color:#B3160F;font-size:12px;font-weight:600;margin-top:-6px">${esc(s.reportError)}</div>` : ''}

function renderStaff() {
  const s = state;
  const isAdmin = s.auth && s.auth.role === 'admin';
  const roleLabel = isAdmin ? 'แอดมิน' : 'พนักงาน';
  const pageTitles = { dashboard: 'แดชบอร์ด', cases: 'เคสแจ้งเรื่อง', users: 'ผู้ใช้งาน' };

  let pageBody = '';
  const pageTitle = pageTitles[s.staffPage];
  if (s.casesLoading && !s.casesLoaded) {
    pageBody = `<div style="padding:40px;text-align:center;color:#8A8380">กำลังโหลดข้อมูล...</div>`;
  } else if (s.casesError) {
    pageBody = `<div style="padding:40px;text-align:center;color:#B3160F">${esc(s.casesError)} <span class="clickable" onclick="loadCases()" style="text-decoration:underline">ลองใหม่</span></div>`;
  } else if (s.staffPage === 'dashboard') {
    pageBody = renderDashboard();
  } else if (s.staffPage === 'cases') {
    pageBody = renderCases();
  } else if (s.staffPage === 'users') {
    pageBody = renderUsers();
  }

        <span style="font-family:'Prompt',sans-serif;font-weight:700;font-size:15px;color:#fff">ANOUSITH <span style="font-weight:500;font-size:11px">EXPRESS</span></span>

      <nav style="padding:14px;display:flex;flex-direction:column;gap:4px;flex:1">
        <div class="clickable" onclick="goStaffPage('dashboard')" style="padding:11px 14px;border-radius:5px;font-size:14px;font-weight:600;background:${s.staffPage === 'dashboard' ? '#D6201F' : 'transparent'};color:${s.staffPage === 'dashboard' ? '#fff' : '#D9D4D1'}">แดชบอร์ด</div>
        <div class="clickable" onclick="goStaffPage('cases')" style="padding:11px 14px;border-radius:5px;font-size:14px;font-weight:600;background:${s.staffPage === 'cases' ? '#D6201F' : 'transparent'};color:${s.staffPage === 'cases' ? '#fff' : '#D9D4D1'}">เคสแจ้งเรื่อง</div>
        ${isAdmin ? `<div class="clickable" onclick="goStaffPage('users')" style="padding:11px 14px;border-radius:5px;font-size:14px;font-weight:600;background:${s.staffPage === 'users' ? '#D6201F' : 'transparent'};color:${s.staffPage === 'users' ? '#fff' : '#D9D4D1'}">ผู้ใช้งาน</div>` : ''}

    <div style="flex:1;background:#F7F5F3;min-width:0">
      <header style="background:#fff;border-bottom:1px solid #EEEAE8;padding:16px 32px;display:flex;justify-content:space-between;align-items:center">

        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:12px;background:#FBEAE9;color:#B3160F;padding:5px 12px;border-radius:20px;font-weight:700">${esc(roleLabel)} · ${esc(s.auth ? s.auth.nickname : '')}</span>
          <div style="width:34px;height:34px;border-radius:50%;background:#221F1F;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">${esc((s.auth && s.auth.nickname ? s.auth.nickname[0] : 'U'))}</div>

      <div style="padding:28px 32px">${pageBody}</div>

  const s = state;

  const kpis = [
    { label: 'เรื่องทั้งหมด', value: d.totalCases, color: '#221F1F' },

    { label: 'ปิดเรื่องแล้ว', value: d.closedCases, color: '#2E7D32' },

  return `

        <input id="reportFromInput" type="date" value="${esc(s.reportFrom)}" onchange="onReportFromChange()" style="padding:6px 8px;border:1px solid #DCD6D3;border-radius:4px;font-size:12px">
        <input id="reportToInput" type="date" value="${esc(s.reportTo)}" onchange="onReportToChange()" style="padding:6px 8px;border:1px solid #DCD6D3;border-radius:4px;font-size:12px">
      ` : ''}
      <div style="flex:1"></div>
      ${isAdmin ? `
        <div class="clickable" onclick="selectAllReportStatus()" style="padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:600;background:#F1EDEB;color:#4A4442">เลือกทั้งหมด</div>
        ${STATUS_FLOW.map((label) => {

      <div class="clickable" onclick="saveDashboardImage()" style="padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;background:#221F1F;color:#fff">⬇ บันทึกเป็นรูปภาพ</div>

    ${d.dashFilterActive ? `<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:#4A4442">

      <span class="clickable" onclick="clearDashboardFilter()" style="color:#D6201F;font-weight:700">✕ ล้างตัวกรอง</span>

// รายละเอียดเคส: แสดงอยู่ภายในหน้าเดียวกับรายการ (ไม่ใช่ popup/modal ลอยทับ) — คลิก "ดู" แล้วพื้นที่เนื้อหาหลัก
// จะสลับมาแสดงหน้านี้แทนที่รายการ พร้อมปุ่ม "← กลับ" เพื่อย้อนกลับไปหน้าเคสแจ้งเรื่อง
// รายละเอียดเคส: popup/modal ลอยทับเหมือนเดิม แต่จัดเป็น 2 คอลัมน์ (ข้อมูลเคส+สถานะ | ประวัติการติดตาม)
// เพื่อให้เนื้อหาทั้งหมดพอดีในหน้าจอเดียว ไม่ต้องเลื่อนดูทั้งหน้า (แต่ละคอลัมน์เลื่อนในตัวเองได้ถ้าเนื้อหายาวมาก)
function renderCaseModal() {
  const c = state.cases.find((x) => x.ticketNo === state.selectedTicket);
  if (!c) return '';
  const pending = state.pendingStatus;
  // ทุกสถานะเลือกได้อิสระไม่ต้องเรียงลำดับ — เลือกแล้วต้องกดปุ่มยืนยันด้านล่างถึงจะบันทึกจริง (ไม่มี popup ของเบราว์เซอร์)
  const steps = STATUS_FLOW.map((label) => {
    const sc = STATUS_COLORS[label];
    const isCurrent = label === c.status;
    const isPending = pending === label;
    if (isPending) {
      return { label, clickable: true, bg: sc.color, color: '#fff', border: sc.color };
    }
    if (isCurrent) {
      return { label, clickable: true, bg: sc.bg, color: sc.color, border: 'transparent' };
    }
    return { label, clickable: true, bg: '#F7F5F3', color: '#5A5450', border: '#E7E2DF' };
  });
  return `
  <div style="position:fixed;inset:0;background:rgba(34,31,31,0.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px" onclick="closeCase()">
    <div style="background:#fff;border-radius:8px;width:960px;max-width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden" onclick="stopProp(event)">
      <div style="padding:16px 24px;border-bottom:1px solid #EEEAE8;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
        <div>
          <div style="font-size:12px;color:#8A8380">เลขพัสดุ · เลขแจ้งเรื่อง ${esc(c.ticketNo)}</div>
          <div style="font-size:17px;font-weight:700;font-family:'Prompt',sans-serif">${esc(c.parcelNo)}</div>
        </div>
        <span class="clickable" onclick="closeCase()" style="font-size:18px;color:#8A8380">✕</span>
      </div>
      <div style="display:flex;flex:1;min-height:0">
        <div style="flex:1.15;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #EEEAE8">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12.5px">
            <div><div style="color:#8A8380;margin-bottom:2px">ผู้แจ้ง</div><div style="font-weight:600">${esc(c.complainantName || '-')}</div></div>
            <div><div style="color:#8A8380;margin-bottom:2px">เบอร์ติดต่อ</div><div style="font-weight:600">${esc(c.phone || '-')}</div></div>
            <div><div style="color:#8A8380;margin-bottom:2px">บริษัทขนส่ง</div><div style="font-weight:600">${esc(c.company || '-')}</div></div>
            <div><div style="color:#8A8380;margin-bottom:2px">พนักงานดูแล</div><div style="font-weight:600">${esc(caseOwner(c) || '-')}</div></div>
          </div>
          <div style="display:flex;gap:14px">
            <div style="flex:1">
              <div style="color:#8A8380;font-size:12.5px;margin-bottom:4px">รายละเอียด</div>
              <div style="font-size:13px;background:#F7F5F3;padding:10px;border-radius:6px;max-height:120px;overflow-y:auto">${esc(c.detail || '-')}</div>
            </div>
            <div style="width:150px;flex-shrink:0">
              <div style="color:#8A8380;font-size:12.5px;margin-bottom:4px">รูปภาพ</div>
              <div style="border-radius:6px;overflow:hidden;border:1px solid #E7E2DF">
                ${c.photoUrl ? `
                <img src="${esc(driveThumbUrl(c.photoUrl))}" data-orig="${esc(c.photoUrl)}" data-stage="0" alt="รูปพัสดุ ${esc(c.parcelNo)}" style="width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#F1EDEB" onerror="handlePhotoError(this)">
                <a href="${esc(driveViewUrl(c.photoUrl))}" target="_blank" rel="noopener" style="display:block;text-align:center;padding:4px;font-size:10.5px;font-weight:600;background:#F7F5F3">ดูขนาดปกติ</a>
                ` : `
                <div style="aspect-ratio:4/3;background:repeating-linear-gradient(45deg,#F1EDEB,#F1EDEB 8px,#E7E2DF 8px,#E7E2DF 16px);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px">
                  <span style="font-family:monospace;font-size:10px;color:#8A8380">[ ไม่มีรูปภาพ ]</span>
                </div>
                `}
              </div>
              <input type="file" id="photoFileInput" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none" onchange="onPhotoFileSelected(this)">
              <button onclick="document.getElementById('photoFileInput').click()" style="width:100%;margin-top:6px;background:#fff;border:1px solid #DCD6D3;padding:5px 0;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;color:#3D3835">${c.photoUrl ? 'แก้ไขรูปภาพ' : '+ เพิ่มรูปภาพ'}</button>
            </div>
          </div>
          ${state.pendingPhotoFile ? `
          <div style="display:flex;align-items:center;gap:12px;background:#F7F5F3;border-radius:6px;padding:10px 12px">
            <img src="${esc(state.pendingPhotoPreviewUrl)}" alt="ตัวอย่างรูปภาพใหม่" style="width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid #E7E2DF;flex-shrink:0">
            <div style="flex:1;font-size:12px;color:#4A4442">ยืนยัน${c.photoUrl ? 'แก้ไข' : 'เพิ่ม'}รูปภาพนี้เป็นรูปประกอบเคส?</div>
            <div style="display:flex;gap:8px;flex-shrink:0">
              <button onclick="cancelPendingPhoto()" ${state.photoUploading ? 'disabled' : ''} style="background:#fff;border:1px solid #DCD6D3;padding:5px 12px;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer;color:#5A5450">ยกเลิก</button>
              <button onclick="confirmPhotoUpload('${esc(c.ticketNo)}')" ${state.photoUploading ? 'disabled' : ''} style="background:#D6201F;color:#fff;border:none;padding:5px 12px;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer">${state.photoUploading ? 'กำลังอัปโหลด...' : 'ยืนยัน'}</button>
            </div>
          </div>` : ''}
          <div>
            <div style="color:#8A8380;font-size:12.5px;margin-bottom:6px">สถานะปัจจุบัน</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              ${steps.map((st) => `<div class="clickable" onclick="selectPendingStatus('${esc(st.label)}')" style="padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:700;background:${st.bg};color:${st.color};border:1px solid ${st.border}">${esc(st.label)}</div>`).join('')}
            </div>
            <div style="font-size:11.5px;color:#A39C99;margin-top:5px">คลิกเลือกสถานะที่ต้องการ แล้วกดยืนยันด้านล่าง</div>
            ${pending && pending !== c.status ? `
            <div style="margin-top:10px;display:flex;align-items:center;gap:10px;background:#F7F5F3;border-radius:6px;padding:9px 12px">
              <div style="font-size:12px;color:#4A4442">เปลี่ยนสถานะเป็น <b>${esc(pending)}</b> ?</div>
              <div style="margin-left:auto;display:flex;gap:8px">
                <button onclick="cancelPendingStatus()" style="background:#fff;border:1px solid #DCD6D3;padding:5px 12px;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer;color:#5A5450">ยกเลิก</button>
                <button onclick="confirmStatusChange('${esc(c.ticketNo)}')" style="background:#D6201F;color:#fff;border:none;padding:5px 12px;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer">ยืนยัน</button>
              </div>
            </div>` : ''}
          </div>
        </div>
        <div style="flex:0.85;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:10px">
          <div style="font-size:13px;font-weight:700;font-family:'Prompt',sans-serif">ประวัติการติดตาม</div>
          ${state.caseHistoryLoading ? `<div style="color:#8A8380;font-size:12.5px">กำลังโหลดประวัติ...</div>` : ''}
          ${!state.caseHistoryLoading && !state.caseHistory.length ? `<div style="color:#A39C99;font-size:12.5px">ยังไม่มีประวัติการติดตาม</div>` : ''}
          ${!state.caseHistoryLoading && state.caseHistory.length ? state.caseHistory.slice().reverse().map((h) => `
          <div style="font-size:12px;border-bottom:1px solid #F3F0EE;padding-bottom:9px">
            <div style="color:#8A8380;white-space:nowrap;margin-bottom:2px">${esc(fmtDateTimeThai(h.datetime))}</div>
            <div><b>${esc(h.status || '-')}</b>${h.channel ? ` · ${esc(h.channel)}` : ''}</div>
            ${h.note ? `<div style="color:#5A5450;margin-top:2px">${esc(h.note)}</div>` : ''}
            <div style="color:#A39C99;margin-top:2px">โดย ${esc(h.staffNickname || h.staffUsername || '-')}</div>

  return `
  <div style="position:fixed;inset:0;background:rgba(34,31,31,0.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px" onclick="closeUserForm()">
    <div style="background:#fff;border-radius:8px;width:420px;max-width:100%" onclick="stopProp(event)">
      <div style="padding:18px 22px;border-bottom:1px solid #EEEAE8;display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:16px;font-weight:700;font-family:'Prompt',sans-serif">เพิ่มผู้ใช้งาน</div>
        <span class="clickable" onclick="closeUserForm()" style="font-size:18px;color:#8A8380">✕</span>
      </div>
      <div style="padding:18px 22px;display:flex;flex-direction:column;gap:10px">
        <div>
          <label style="font-size:12.5px;font-weight:600;color:#4A4442;display:block;margin-bottom:5px">ชื่อผู้ใช้ (username)</label>
          <input id="newUserUsername" style="width:100%;padding:9px 12px;border:1px solid #DCD6D3;border-radius:4px;font-size:13.5px">
        </div>
        <div>
          <label style="font-size:12.5px;font-weight:600;color:#4A4442;display:block;margin-bottom:5px">ชื่อเล่น</label>
          <input id="newUserNickname" style="width:100%;padding:9px 12px;border:1px solid #DCD6D3;border-radius:4px;font-size:13.5px">
        </div>
        <div>
          <label style="font-size:12.5px;font-weight:600;color:#4A4442;display:block;margin-bottom:5px">สิทธิ์</label>
          <select id="newUserRole" style="width:100%;padding:9px 12px;border:1px solid #DCD6D3;border-radius:4px;font-size:13.5px;background:#fff">
            <option value="staff">พนักงาน</option>
            <option value="admin">แอดมิน</option>
          </select>
        </div>
        <div>
          <label style="font-size:12.5px;font-weight:600;color:#4A4442;display:block;margin-bottom:5px">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
          <input id="newUserPassword" type="password" style="width:100%;padding:9px 12px;border:1px solid #DCD6D3;border-radius:4px;font-size:13.5px">
        </div>
        ${s.userFormError ? `<div style="color:#B3160F;font-size:12px;font-weight:600">${esc(s.userFormError)}</div>` : ''}
        <button onclick="submitUserForm()" style="margin-top:2px;background:#D6201F;color:#fff;border:none;padding:11px;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer">${s.userFormBusy ? 'กำลังบันทึก...' : 'เพิ่มผู้ใช้งาน'}</button>
      </div>
    </div>
  </div>`;
}

// ===================== Boot: เช็ค session cookie เดิม (ถ้ามี) ก่อนแสดงผลครั้งแรก =====================
async function init() {
  try {
    const res = await apiGet('/api/me');
    if (res.ok) {
      setState({
        booting: false, view: 'staff', staffPage: 'dashboard',
        auth: { username: res.username, nickname: res.nickname, role: res.role },
      });
      loadCases();
      return;
    }
  } catch (e) { /* เข้าเว็บแบบไม่ล็อกอินได้ตามปกติ */ }
  setState({ booting: false });
}
init();
</script>
