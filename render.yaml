services:
  - type: web
    name: anousith-parcel-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # -w 1 = single worker เท่านั้น ห้ามเพิ่ม เพราะโค้ดใช้ threading.Lock ในหน่วยความจำ
    # กันเลขแจ้งเรื่อง (ticket number) ชนกันตอนสร้างพร้อมกัน — multi-worker จะทำให้ lock นี้ใช้ไม่ได้ผล
    startCommand: gunicorn app:app -w 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SPREADSHEET_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      # ไอดีโฟลเดอร์ Google Drive สำหรับอัปโหลดรูปภาพเคส (ฟีเจอร์เพิ่ม/แก้ไขรูปภาพในหน้ารายละเอียดเคส)
      # ต้องแชร์โฟลเดอร์นี้ให้อีเมลของ service account เป็นสิทธิ์ "ผู้แก้ไข (Editor)" ก่อน — ดู README.md
      - key: DRIVE_UPLOAD_FOLDER_ID
        sync: false
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.9"
